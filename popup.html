<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="css/popup.css">
</head>
<body>
  <label class="toggle">
    <input type="checkbox" id="virtual-default">
    <span>Use the virtual camera by default</span>
  </label>
  <p class="hint">Or pick "Virtual Chrome Webcam" in a site's camera menu.</p>

  <h2>Scenes</h2>
  <p class="section-hint">Switch any time, even mid-call.</p>
  <div id="scenes" class="scenes" role="radiogroup" aria-label="Scenes"></div>

  <div class="quick">
    <label><input type="checkbox" id="camera"> Camera on</label>
    <label><input type="checkbox" id="mirror"> Mirror</label>
  </div>
  <p id="notice" class="notice" hidden></p>

  <button id="studio" type="button">Open Studio…</button>

  <script src="js/filter-registry.js"></script>
  <script src="js/filters/none.js"></script>
  <script src="js/filters/black-and-white.js"></script>
  <script src="js/filters/sepia.js"></script>
  <script src="js/filters/pixelate.js"></script>
  <script src="js/filters/posterize.js"></script>
  <script src="js/filters/crt.js"></script>
  <script src="js/filters/game-boy.js"></script>
  <script src="js/filters/distorted-tv.js"></script>
  <script src="js/filters/pencil-sketch.js"></script>
  <script src="js/filters/comic.js"></script>
  <script src="js/filters/money.js"></script>
  <script src="js/filters/thermal.js"></script>
  <script src="js/filters/kaleidoscope.js"></script>
  <script src="js/filters/rgb-glitch.js"></script>
  <script src="js/filters/eye-bar.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/popup.js"></script>
</body>
</html>
